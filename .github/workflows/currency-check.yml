name: List Currency Check

# Runs monthly, just after the release PDF build on the 1st, and reports any
# listed project that no longer meets the CONTRIBUTING.md criteria. Opens an
# issue with the findings rather than failing a build — a listed project being
# archived upstream is news to act on, not a broken repository.
on:
  workflow_dispatch: {}
  schedule:
    # the day after the monthly release
    - cron: "0 0 2 * *"

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: check-list-currency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Offline, no token, under a second. The classification it guards cannot
      # be reproduced on demand against the live API.
      - name: Self-test the checker
        run: python3 .github/scripts/test_check_currency.py

      # The script writes `findings` and `unchecked` to $GITHUB_OUTPUT itself.
      - name: Check every GitHub entry
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/check_currency.py \
            --readme README.md --out currency-report.md

      - name: Open an issue if anything needs attention
        if: steps.check.outputs.findings != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "List currency check: ${{ steps.check.outputs.findings }} entries need attention ($(date +'%Y-%m'))" \
            --body-file currency-report.md

      # A run where the API went quiet must not read as a clean run, even when
      # it found nothing, so the counts always reach the job summary.
      - name: Summarise the run
        if: always()
        run: |
          {
            echo "### List currency check"
            echo ""
            echo "- findings: ${{ steps.check.outputs.findings }}"
            echo "- could not be checked: ${{ steps.check.outputs.unchecked }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check.outputs.unchecked }}" != "0" ]; then
            echo "::warning::${{ steps.check.outputs.unchecked }} repositories could not be checked; see the report artifact"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: currency-report
          path: currency-report.md
